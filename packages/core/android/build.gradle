buildscript {
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

def resolveBinaryPackage() {
  def candidates = [
    "ffmpeg-full-gpl",
    "ffmpeg-full",
    "ffmpeg-min",
  ]

  for (pkg in candidates) {
    def candidate = file("${rootDir}/../node_modules/@react-native-nitro-ffmpeg/${pkg}")
    if (candidate.exists()) return candidate
    candidate = file("${projectDir}/../../node_modules/@react-native-nitro-ffmpeg/${pkg}")
    if (candidate.exists()) return candidate
  }

  logger.warn("[react-native-nitro-ffmpeg] No FFmpeg binary package found.")
  return null
}

def binaryPackage = resolveBinaryPackage()

android {
  namespace "com.nitro.ffmpeg"
  compileSdk safeExtGet('compileSdkVersion', 35)

  defaultConfig {
    minSdk safeExtGet('minSdkVersion', 24)
    targetSdk safeExtGet('targetSdkVersion', 35)

    externalNativeBuild {
      cmake {
        cppFlags "-O2 -frtti -fexceptions -std=c++20"
        abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  if (binaryPackage != null) {
    sourceSets {
      main {
        jniLibs.srcDirs = ["${binaryPackage}/android/jniLibs"]
      }
    }
  }

  buildFeatures {
    prefab true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "com.margelo.nitro:react-native-nitro-modules"
}
